<title>GI Lab Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: transparent page. Brand bar on top, builder stage card on the left, headline, build steps and status on the right. */
:root {
  --ink: #f4f7fb; --muted: #9aa7b5;
  --line: rgba(255, 255, 255, 0.10); --frame: #2c3038; --ground: #18212a;
  --brand-maroon: #6f0f12; --brand-red: #ef3b26; --brand-orange: #ff7826; --brand-green: #45a34b; --brand-blue: #2f74bd;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  background: transparent;
}
.shell { max-width: 2400px; margin-inline: auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: clamp(12px, 2.2vh, 26px) clamp(16px, 4vw, 56px) clamp(10px, 1.8vh, 20px); overflow: hidden; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { background: #fff; border-radius: 14px; padding: 8px 14px; display: flex; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
.brand img { height: 34px; width: auto; display: block; }
.url { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; color: #c6d0da; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.04); }
.page {
  flex: 1; min-height: 0; display: grid; align-items: center;
  grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr);
  gap: clamp(20px, 3.4vw, 56px); padding-block: 0;
}
.stage {
  position: relative; min-width: 0; touch-action: manipulation;
  border: 0; border-radius: 28px; overflow: hidden;
  background:
    radial-gradient(ellipse at 40% 75%, rgba(255, 255, 255, 0.06), transparent 60%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  padding: 14px 10px 0;
}
.stage::before { /* hazard tape */
  content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; z-index: 1;
  background: repeating-linear-gradient(-45deg, #ff7826 0 12px, #15191e 12px 24px);
}
canvas { display: block; width: min(100%, calc((100vh - 170px) * 1.607)); width: min(100%, calc((100dvh - 170px) * 1.607)); max-width: 100%; aspect-ratio: 900 / 560; margin-inline: auto; }

.content { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #ffb27a; font-weight: 800; margin: 0 0 clamp(8px, 1.6vh, 14px); padding: 6px 13px; border-radius: 999px; background: rgba(255, 120, 38, 0.10); border: 1px solid rgba(255, 120, 38, 0.28); }
.eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #ff7826; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
h1 { font-size: clamp(1.9rem, min(3.7vw, 6.6vh), 7rem); line-height: 0.96; margin: 0; font-weight: 900; letter-spacing: -0.045em; text-wrap: balance; }
.accent { background: linear-gradient(90deg, #ef2c1d, #ff7b24, #49aa61, #2f7bd0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { max-width: 42ch; color: var(--muted); font-size: clamp(0.8rem, min(1.25vw, 2vh), 1.6rem); line-height: 1.6; margin: clamp(10px, 2vh, 18px) auto 0; }
.steps { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.step { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #7d8a98; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); transition: all 0.3s; }
.step b { font-family: var(--font-mono); font-weight: 500; font-size: 11px; opacity: 0.8; }
.step.on { color: #ffd9bd; border-color: rgba(255, 120, 38, 0.5); background: rgba(255, 120, 38, 0.12); }
.step.done { color: #b9f0c8; border-color: rgba(80, 200, 120, 0.4); background: rgba(80, 200, 120, 0.10); }
.marquee { margin-top: clamp(14px, 2.8vh, 26px); max-width: 100%; filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.45)); }
.bulbs { position: relative; isolation: isolate; padding: 4px; border-radius: 16px; background: rgba(255, 120, 38, .22); }
.border-glow { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; filter: drop-shadow(0 0 4px rgba(255, 120, 38, .45)); }
.border-glow rect {
  x: 2px; y: 2px; width: calc(100% - 4px); height: calc(100% - 4px); rx: 14px;
  fill: none; stroke: var(--brand-orange); stroke-width: 4px; stroke-linecap: round;
  stroke-dasharray: 16 84; stroke-dashoffset: 0;
  animation: border-run 4s linear infinite;
}
@keyframes border-run {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -100; }
}
.board {
  position: relative; display: grid; justify-items: center; gap: 4px; padding: clamp(8px, 1.8vh, 18px) clamp(14px, 2.2vw, 34px) clamp(7px, 1.4vh, 14px);
  background: radial-gradient(ellipse at 50% 30%, #1b2733, #0a0f14 75%); border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 0, 0, 0.6);
}
.neon { font: 800 clamp(1.5rem, min(3.1vw, 6vh), 5.4rem)/1 var(--font-display); letter-spacing: 0.1em; padding-left: 0.1em; white-space: nowrap; display: inline-flex; }
.neon span { display: inline-block; color: var(--c); opacity: .85; animation: lit 3.6s ease-in-out infinite; animation-delay: calc(var(--n) * 0.12s); text-shadow: 0 0 6px rgba(255, 255, 255, .06); }
.neon span.sp { width: 0.45em; }
@keyframes lit { 0%, 55%, 100% { opacity: .75; text-shadow: 0 0 5px rgba(255, 150, 63, .15); } 20% { opacity: 1; text-shadow: 0 0 10px rgba(255, 150, 63, .65), 0 0 22px rgba(255, 120, 38, .25); } }
.sub2 { font: 500 11px/1 var(--font-mono); letter-spacing: 0.34em; color: #7f8b98; padding-left: 0.34em; }
@media (prefers-reduced-motion: reduce) { .neon span, .border-glow rect { animation: none; } }
.status { margin-top: 22px; display: flex; align-items: center; gap: 12px; padding: 11px 18px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.05); font-size: 13px; color: #d8e0e8; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #50c878; box-shadow: 0 0 0 6px rgba(80, 200, 120, 0.10); animation: dot 1.4s ease-in-out infinite; }
@keyframes dot { 50% { opacity: 0.45; transform: scale(0.85); } }
.pct { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; color: #fff; }
.track { width: min(320px, 78%); height: 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.09); overflow: hidden; margin-top: 14px; }
.track i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, var(--brand-red), var(--brand-orange) 35%, var(--brand-green) 70%, var(--brand-blue)); box-shadow: 0 0 14px rgba(255, 120, 38, 0.6); }
.hint { margin: clamp(10px, 1.8vh, 16px) 0 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.34); }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.32); }

@media (min-width: 1900px) and (min-height: 1000px) { .eyebrow { font-size: 15px; padding: 8px 18px; } .hint, .foot, .url { font-size: 13px; } .sub { max-width: 46ch; } .bulbs { border-radius: 20px; } .border-glow rect { rx: 18px; } .board { border-radius: 16px; } .sub2 { font-size: 15px; } }
@media (max-height: 720px) { .hint { display: none; } }
@media (max-width: 960px) {
  .shell { padding: 14px 14px 12px; }
  .top, .foot, .hint { display: none; }
  .page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; gap: clamp(10px, 2vh, 18px); align-content: center; align-items: center; }
  .content { order: -1; }
  h1 { font-size: clamp(1.7rem, min(9.4vw, 5.2vh), 3rem); }
  .sub { font-size: clamp(0.78rem, 2.1vh, 0.95rem); }
  .neon { font-size: clamp(1.4rem, min(8.6vw, 5vh), 2.4rem); }
  .marquee { margin-top: clamp(10px, 2vh, 18px); }
  .stage { padding: 10px 6px 0; border-radius: 22px; }
}
@media (max-width: 960px) and (max-height: 560px) {
  .shell { padding: 8px 12px; }
  .page { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: none; gap: 14px; align-items: center; }
  .content { order: 0; }
  canvas { width: min(100%, calc((100vh - 50px) * 1.607)); width: min(100%, calc((100dvh - 50px) * 1.607)); }
  .stage { padding: 8px 4px 0; border-radius: 18px; }
  h1 { font-size: clamp(1.1rem, min(4.4vw, 8.4vh), 2.1rem); }
  .eyebrow { font-size: 8.5px; padding: 4px 9px; margin-bottom: 6px; letter-spacing: 0.2em; }
  .sub { font-size: clamp(0.66rem, 3.4vh, 0.85rem); margin-top: 8px; }
  .neon { font-size: clamp(1rem, min(3.4vw, 7.4vh), 1.9rem); }
  .marquee { margin-top: 10px; }
  .bulbs { border-radius: 16px; }
  .board { padding: 8px 14px 7px; }
  .sub2 { display: none; }
}
@media (max-width: 960px) and (max-height: 430px) { .sub { display: none; } }
@media (prefers-reduced-motion: reduce) { .eyebrow i, .dot { animation: none; } }
</style>

<div class="shell">
  <main class="page">
    <section class="stage" id="stageBox">
      <canvas id="stage" role="img" aria-label="An animated builder with black glasses and curly hair hammers a 3D GI Lab sign, first the left side, then the front. Each hit drops more blocks into place until the sign is complete and a Coming Soon banner appears."></canvas>
    </section>

    <section class="content">
            <h1>We&rsquo;re <span class="accent">building</span><br>something new.</h1>
      <p class="sub">Our crew is putting the final pieces together. The new GI Lab website will be live soon. Transforming spaces. Inspiring people.</p>
      <div class="marquee" role="img" aria-label="Coming soon">
        <div class="bulbs" id="bulbs"><svg class="border-glow" aria-hidden="true" focusable="false"><rect pathLength="100"/></svg><div class="board" aria-hidden="true">
          <span class="neon" id="neon">COMING SOON</span>
        </div></div>
        <span id="status" hidden></span><span id="pct" hidden></span>
      </div>
      <div class="track" id="trk" hidden><i id="bar"></i></div>
    </section>
  </main>

</div>

<script>
(function () {
  var n = document.getElementById("neon"), cols = ["#f4a06a"];
  var txt = n.textContent; n.textContent = "";
  for (var i = 0; i < txt.length; i++) { var s = document.createElement("span"); s.textContent = txt[i] === " " ? "" : txt[i]; if (txt[i] === " ") s.className = "sp"; s.style.setProperty("--n", i); s.style.setProperty("--c", cols[i % cols.length]); n.appendChild(s); }
})();
</script>

      const a = -Math.PI * (0.05 + Math.random() * 0.9);
      const sp = 200 + Math.random() * 380;
      parts.push({ kind: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.35 + Math.random() * 0.4, col: colors[i % colors.length], sz: 2 + Math.random() * 2 });
    }
    for (let i = 0; i < 3; i++) parts.push({ kind: "dust", x: x - 8 + Math.random() * 6, y: y + 20 + Math.random() * 40, vx: (-30 - Math.random() * 40) * (impactSide ? -1 : 1), vy: -10 - Math.random() * 20, life: 0, max: 0.6 + Math.random() * 0.2, sz: 6 });
  }
  function confetti() {
    for (let i = 0; i < 70; i++) parts.push({
      kind: "conf", x: CX - BW / 2 + 20 + Math.random() * (BW - 40), y: BY - BH - 10 + Math.random() * 30,
      vx: (Math.random() - 0.5) * 220, vy: 20 + Math.random() * 160, life: 0, max: 2.4 + Math.random() * 0.8,
      col: BRAND[i % BRAND.length], sz: 6 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12
    });
  }

  function onImpact() {
    const sd = sideOf(phase);
    impactSide = sd;
    shake = calm ? 0 : 1; squash = 1; hv += 120; push = 0; impactT = clock;
    burst(hitX(sd), HIT_Y + (Math.random() - 0.5) * 30, 16, ["#ffd25e", "#ff9a3c", "#ffffff", "#e56d22"]);
    if (state !== "build") return;
    const p = PH[phase], f = FACES[p.face];
    if (p.pending) {
      p.pending = false;
      burst(hitX(sd), HIT_Y, 26, ["#ffd25e", "#ff9a3c", "#ffffff", "#285591"]);
      if (phase < PH.length - 1) {
        state = "turn"; turnEnter = clock; turnT0 = clock + 0.4; fromPh = phase; toPh = phase + 1;
      } else {
        state = "done"; doneT0 = clock;
        if (!calm) confetti();
      }
      return;
    }
    for (let i = 0; i < p.cph && p.released < p.cells.length; i++, p.released++) {
      p.cells[p.released].t0 = clock + 0.05 + i * 0.08;
    }
    f.animUntil = clock + 0.05 + p.cph * 0.08 + 0.9;
    if (p.released >= p.cells.length) p.pending = true;
  }

  function update(dt) {
    hv += (-hj * 240 - hv * 12) * dt; hj += hv * dt;
    shake = Math.max(0, shake - dt * 4.5);
    squash = Math.max(0, squash - dt * 6);
    push = Math.max(0, push - dt * 4.5);
    if (state === "build") {
      const prev = swingT;
      swingT += dt;
      if (prev < IMPACT && swingT >= IMPACT) onImpact();
      if (swingT >= SWING) swingT -= SWING;
    } else if (state === "turn") {
      if (swingT < SWING) swingT = Math.min(SWING, swingT + dt);
      if (clock - turnT0 >= TURN_D) { state = "build"; phase = toPh; swingT = 0; }
    } else if (state === "done") {
      if (swingT < SWING) swingT = Math.min(SWING, swingT + dt);
      bob = Math.sin((clock - doneT0) * 5) * 2;
      /* stays on the finished shot until the character is clicked */
    } else if (state === "reset") {
      bob = 0;
      if (clock - resetT0 > 1.75) {
        cells.forEach(c => { c.t0 = null; });
        PH.forEach(p => { p.released = 0; p.pending = false; });
        FACES.forEach(f => { f.dirty = true; f.animUntil = 0; });
        phase = 0; swingT = 0; state = "build";
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life > p.max) { parts.splice(i, 1); continue; }
      if (p.kind === "spark" || p.kind === "conf") { p.vy += (p.kind === "spark" ? 1100 : 380) * dt; p.vx *= p.kind === "conf" ? 0.995 : 1; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.rot !== undefined) p.rot += p.vr * dt;
    }
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  function stripes(x, y, w, h, p, c1, c2, c) {
    c = c || ctx;
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    c.fillStyle = c2; c.fillRect(x, y, w, h); c.fillStyle = c1;
    for (let sx = x - h; sx < x + w + h; sx += p) {
      c.beginPath(); c.moveTo(sx, y + h); c.lineTo(sx + p / 2, y + h); c.lineTo(sx + p / 2 + h, y); c.lineTo(sx + h, y); c.closePath(); c.fill();
    }
    c.restore();
  }

  // ---------- cached static layers (window chrome + shadow, ground, pre-scaled logo) ----------
  const PAD = 44, WIN_LH = 64;
  function makeLayer(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w * scale)); c.height = Math.max(1, Math.ceil(h * scale)); return c; }
  function rebuildLayers() {
    layersDirty = false;
    groundLayer = makeLayer(W, 52);
    let g = groundLayer.getContext("2d");
    g.setTransform(scale, 0, 0, scale, 0, -500 * scale);
    g.fillStyle = T.ground; g.fillRect(0, 502, W, 24);
    g.fillStyle = T.line; g.fillRect(0, 502, W, 1.5);
    stripes(0, 530, W, 20, 30, "#e56d22", "#1c1d20", g);
  }

  function landedCount() {
    let n = 0;
    for (const c of cells) if (c.t0 !== null && clock >= c.t0 + 0.55) n++;
    return n;
  }

  function paintCells(g, f) {
    for (const c of f.cells) {
      if (c.t0 === null || clock < c.t0) continue;
      let alpha = 1, gr = 1;
      if (state === "reset") {
        const p = clamp((clock - resetT0 - (f.rows - c.row) * 0.05) / 0.7, 0, 1);
        alpha = 1 - p * p;
      } else {
        gr = ease.outCubic(clamp((clock - c.t0) / 0.42, 0, 1));
      }
      if (alpha <= 0.01 || gr <= 0.01) continue;
      const hh = c.h * gr;
      g.globalAlpha = alpha;
      g.drawImage(f.fin, c.x * S, (c.y + c.h - hh) * S, c.w * S, hh * S, c.x - 0.3, c.y + c.h - hh - 0.3, c.w + 0.6, hh + 0.6);
      g.globalAlpha = 1;
    }
  }
  function faceTex(f) {
    const g = f.g, b = f.bg;
    g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; g.clearRect(0, 0, f.w, f.h);
    b.globalCompositeOperation = "source-over"; b.globalAlpha = 1; b.clearRect(0, 0, f.w, f.h);
    if (state === "done") { g.drawImage(f.fin, 0, 0, f.w, f.h); b.drawImage(f.fin, 0, 0, f.w, f.h); return; }
    g.globalAlpha = 0.1; g.drawImage(f.fin, 0, 0, f.w, f.h); g.globalAlpha = 1;
    g.setLineDash([4, 4]); g.strokeStyle = "rgba(160,200,255,0.34)"; g.lineWidth = 1; g.beginPath();
    for (const c of f.cells) if (c.t0 === null || clock < c.t0) g.rect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
    g.stroke(); g.setLineDash([]);
    paintCells(g, f); paintCells(b, f);
  }

  function drawBox() {
    const f = FACES[0];
    if (!f.tex) return;
    if (f.dirty || clock < f.animUntil || state === "reset" || state === "done") {
      faceTex(f); f.dirty = false;
      const d = f.dark.getContext("2d");
      d.setTransform(1, 0, 0, 1, 0, 0); d.globalCompositeOperation = "source-over"; d.clearRect(0, 0, f.dark.width, f.dark.height);
      d.drawImage(f.built, 0, 0);
      d.globalCompositeOperation = "source-atop"; d.fillStyle = "rgba(10,22,40,0.66)"; d.fillRect(0, 0, f.dark.width, f.dark.height);
    }
    const ct = Math.cos(YAW), st = Math.sin(YAW), cp = Math.cos(PITCH), sp = Math.sin(PITCH);
    const pr = (x, y, z) => { const xr = x * ct + z * st, zr = -x * st + z * ct; return [CX + xr, BY - y * cp + zr * sp]; };
    const hw = f.w / 2, hd = DEPTH / 2;
    // glow + floor shadow
    const gl = ctx.createRadialGradient(CX, BY - 130, 10, CX, BY - 130, 330);
    gl.addColorStop(0, "rgba(255,150,60,0.20)"); gl.addColorStop(0.5, "rgba(47,116,189,0.11)"); gl.addColorStop(1, "rgba(47,116,189,0)");
    ctx.fillStyle = gl; ctx.fillRect(CX - 360, BY - 480, 720, 600);
    ctx.fillStyle = "rgba(0,0,0,0.32)"; ctx.beginPath(); ctx.ellipse(CX + 26, BY + 20, f.w * 0.62, 20, 0, 0, 7); ctx.fill();
    const layer = (img, z) => {
      const a = pr(-hw, f.h, z), b = pr(hw, f.h, z), c = pr(-hw, 0, z);
      ctx.save();
      ctx.transform((b[0] - a[0]) / f.w, (b[1] - a[1]) / f.w, (c[0] - a[0]) / f.h, (c[1] - a[1]) / f.h, a[0], a[1]);
      ctx.drawImage(img, 0, 0, f.w, f.h);
      ctx.restore();
    };
    for (let i = NL; i >= 1; i--) layer(f.dark, hd - DEPTH * i / NL);
    layer(f.tex, hd);
  }

  function lg(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
  function rg(x0, y0, r0, x1, y1, r1, stops) { const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
  // ---------- sprite character (client artwork, animated as a pose sequence) ----------
  const SP = {};
  const K_SMALL = 0.72, K_HERO = 0.866, AX = 170, HERO_DX = -2.5, FY = { ready: 3.4, smash: -5.2, hero: 2.9, heroW0: 2.9, heroW1: 2.9, heroW2: 2.9 };
  function loadSprites() {
    return Promise.all(Object.keys(SPR_DATA).map(name => new Promise(res => {
      const d = SPR_DATA[name], im = new Image();
      SP[name] = { img: im, w: d.w, h: d.h, ax: name === "hero" ? 54.5 : d.ax, ay: d.ay, k: (name === "hero" || name.startsWith("heroW")) ? K_HERO : name.startsWith("hero") ? 0.563 : K_SMALL };
      im.onload = res; im.onerror = res; im.src = "data:image/webp;base64," + d.src;
    })));
  }
  function spr(name, x, y, sx, sy, rot, alpha, shear) {
    const s = SP[name];
    if (!s || !s.img.complete || !s.img.naturalWidth || alpha <= 0.003) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y + (FY[name] || 0)); ctx.rotate(rot); ctx.scale(sx, sy); if (shear) ctx.transform(1, 0, shear, 1, 0, 0);
    ctx.drawImage(s.img, -s.ax * s.k, -s.ay * s.k, s.w * s.k, s.h * s.k);
    ctx.restore();
  }
  function groundShadow(cx, rx, lift) {
    const k = clamp(1 - lift / 90, 0.5, 1);
    ctx.fillStyle = "rgba(0,0,0," + (0.2 * k) + ")"; ctx.beginPath(); ctx.ellipse(cx, 505, rx * k, 10 * k, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0," + (0.12 * k) + ")"; ctx.beginPath(); ctx.ellipse(cx, 505, rx * 1.18 * k, 13 * k, 0, 0, 7); ctx.fill();
  }

  // swoosh left behind by the hammer during the fast downswing
  function swoosh(a) {
    if (a <= 0.01) return;
    ctx.save();
    const g = ctx.createLinearGradient(300, 120, 376, 436);
    g.addColorStop(0, "rgba(255,214,120,0)"); g.addColorStop(0.55, "rgba(255,165,60," + (0.5 * a) + ")"); g.addColorStop(1, "rgba(229,109,34," + (0.85 * a) + ")");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(292, 118); ctx.quadraticCurveTo(512, 160, 380, 440);
    ctx.quadraticCurveTo(452, 232, 312, 166); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,244,205," + (0.95 * a) + ")"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(330, 140); ctx.quadraticCurveTo(494, 190, 384, 420); ctx.stroke();
    ctx.restore();
  }
  function impactFlash(hx) {
    const e = clock - impactT;
    if (e < 0 || e > 0.16) return;
    const k = e / 0.16;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = "#ffb13c"; ctx.lineWidth = 7 * (1 - k) + 1; ctx.beginPath(); ctx.arc(hx + 6, HIT_Y + 2, 12 + 52 * k, 0, 7); ctx.stroke();
    ctx.fillStyle = "#fff6d6"; ctx.beginPath(); ctx.arc(hx + 6, HIT_Y + 2, 18 * (1 - k), 0, 7); ctx.fill();
    ctx.restore();
  }

  function flipped(on, fn, pivot) {
    if (!on) { fn(); return; }
    ctx.save(); ctx.translate(pivot === undefined ? W : 2 * pivot, 0); ctx.scale(-1, 1); fn(); ctx.restore();
  }
  function flipped(on, fn) {
    if (!on) { fn(); return; }
    ctx.save(); ctx.translate(2 * CX, 0); ctx.scale(-1, 1); fn(); ctx.restore();
  }
  function poseBuild() {
    const [fi, u] = frameAt(swingT);
    const name = SW[fi][0], hero = name.startsWith("hero");
    let x = hero ? AX + HERO_DX : AX, y = 0, sx = 1, sy = 1, rot = 0;
    let shear = 0;
    switch (fi) {
      case 0: sx = 1 + 0.012 * u; sy = 1 - 0.018 * u; break;
      // wind-up: only the arms/elbows lift (baked frames), the body stays planted
      case 1: case 2: case 3: break;
      case 4: sy = 1.0; break;
      case 5: break;
      case 6: sx = 1 + 0.09 * (1 - u); sy = 1 - 0.11 * (1 - u); break;
      case 7: { const s = Math.sin(Math.PI * u); sx = 1 - 0.012 * s; sy = 1 + 0.02 * s; break; }
      default: break;
    }
    if (fi === 4) swoosh(0.5); else if (fi === 5) swoosh(0.9); else if (fi === 6) swoosh(0.5 * (1 - u));
    if (hero && rot) { x += 48 * (1 - Math.cos(rot)); y -= 48 * Math.sin(rot); }
    groundShadow(x + (hero ? 48 : 86), hero ? 128 : 140, -y);
    spr(name, x, 502 + y, sx, sy, rot, 1, shear);
  }
  function drawCharacter() {
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    if (state === "build") {
      flipped(PH[phase].side, poseBuild);
    } else if (state === "turn") {
      const el = clock - turnEnter, hw = clamp(el / 0.14, 0, 1);
      const fs = sideOf(fromPh), ts = sideOf(toPh), hx = AX + HERO_DX;
      const e = ease.inOutSine(clamp((clock - turnT0) / TURN_D, 0, 1));
      if (hw < 1) flipped(fs, () => spr("smash", AX, 502, 1 + 0.07 * squash, 1 - 0.09 * squash, 0, 1));
      if (fs === ts) {
        const hop = 0;
        flipped(fs, () => { groundShadow(hx, 128, hop); spr("hero", hx, 502 - hop, 1, 1, 0, hw); });
      } else {
        const xw = lerp(hx, 2 * CX - hx, e), hop = 0;
        groundShadow(xw, 128, hop);
        ctx.save(); ctx.translate(xw, 0); ctx.scale(e > 0.5 ? -1 : 1, 1); ctx.translate(-xw, 0);
        spr("hero", xw, 502 - hop, 1, 1, 0, hw);
        ctx.restore();
      }
    } else {
      const t0 = state === "done" ? doneT0 : resetT0;
      const hw = state === "done" ? clamp((clock - doneT0) / 0.14, 0, 1) : 1 - clamp((clock - resetT0 - 0.5) / 0.35, 0, 1);
      const el = clock - t0;
      const hop = 0;
      if (hw < 1) {
        const base = state === "done" ? "smash" : "ready", sq = squash;
        flipped(false, () => spr(base, AX, 502, state === "done" ? 1 + 0.07 * sq : 1, state === "done" ? 1 - 0.09 * sq : 1, 0, 1));
      }
      flipped(false, () => {
        groundShadow(AX + HERO_DX, 128, hop);
        spr("hero", AX + HERO_DX, 502 - hop, 1 + 0.006 * Math.sin(el * 3), 1 - 0.01 * Math.sin(el * 3), 0, hw);
      });
    }
    flipped(impactSide, () => impactFlash(HITX));
  }

  function drawParticles() {
    for (const p of parts) {
      const k = p.life / p.max;
      if (p.kind === "spark") {
        ctx.strokeStyle = p.col; ctx.globalAlpha = 1 - k; ctx.lineWidth = p.sz; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      } else if (p.kind === "dust") {
        ctx.fillStyle = T.ground; ctx.globalAlpha = 0.6 * (1 - k);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.sz + k * 26, 0, 7); ctx.fill();
      } else {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1;
        ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (layersDirty) rebuildLayers();
    ctx.drawImage(groundLayer, 0, 500, W, 52);
    drawBox();
    drawCharacter();
    drawParticles();
  }

  let lastPct = -1, lastState = "";
  const stepEls = Array.from(document.querySelectorAll(".step")); let lastStep = -1;
  function updateReadout() {
    const pct = state === "done" || state === "reset" ? 100 : Math.round(landedCount() / cells.length * 100);
    if (pct !== lastPct) {
      lastPct = pct;
      pctEl.textContent = String(pct).padStart(3, "0") + "%";
      barEl.style.transform = "scaleX(" + pct / 100 + ")";
    }
    const stepKey = state === "done" || state === "reset" ? 9 : phase;
    if (stepKey !== lastStep) {
      lastStep = stepKey;
      stepEls.forEach((el, i) => { el.className = "step" + (stepKey === 9 || i < stepKey ? " done" : i === stepKey ? " on" : ""); });
    }
    const s = state === "done" || state === "reset" ? "Coming soon" : "Building";
    if (s !== lastState) { lastState = s; statusEl.textContent = s; }
  }

  let last = 0;
  function frame(ts) {
    const real = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    const dt = real * (boost > 0 ? 2 : 1);
    boost = Math.max(0, boost - real);
    clock += dt;
    update(dt); render(); updateReadout();
    requestAnimationFrame(frame);
  }

  function overHero(e) {
    const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    return x > 20 && x < 340 && y > 90 && y < 520;
  }
  function replay() { if (state === "done" && clock - doneT0 > 0.6) { state = "reset"; resetT0 = clock; } }
  canvas.addEventListener("pointerdown", e => { if (overHero(e)) replay(); });
  canvas.addEventListener("pointermove", e => { canvas.style.cursor = state === "done" && overHero(e) ? "pointer" : ""; });
  canvas.tabIndex = 0;
  canvas.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); replay(); } });

  function start() {
    const bi = document.getElementById("brandImg"); if (bi) bi.src = LOGO_SRC;
    resize();
    buildCells();
    requestAnimationFrame(t => { last = t; frame(t); });
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layersDirty = true; });
  let started = false;
  function go() { if (started) return; started = true; start(); }
  Promise.all([
    logo.decode ? new Promise(res => { logo.onload = res; logo.onerror = res; logo.src = LOGO_SRC; }) : Promise.resolve(),
    Promise.race([
      Promise.all([document.fonts.load('800 34px "Big Shoulders Display"'), document.fonts.load('500 12px "JetBrains Mono"')]),
      new Promise(res => setTimeout(res, 1800))
    ]).catch(() => {})
    , loadSprites()
  ]).then(go);
})();
</script>
